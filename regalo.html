<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una carta para ti</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fde4f0;--bg2:#e9defd;--paper:#fffafc;--ink:#4b1d3a;--accent:#c2185b;--soft:#f6c6dc;--line:#e8b4cc;--shadow:rgba(110,30,80,.22);--hand:"Caveat","Segoe Script","Bradley Hand",cursive;--serif:"Lora",Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b0f25;--bg2:#1a1033;--paper:#3a1a35;--ink:#ffe3ef;--accent:#ff7ab0;--soft:#5d2850;--line:#7a3868;--shadow:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2b0f25;--bg2:#1a1033;--paper:#3a1a35;--ink:#ffe3ef;--accent:#ff7ab0;--soft:#5d2850;--line:#7a3868;--shadow:rgba(0,0,0,.55);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{min-height:100vh;font-family:var(--serif);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;overflow-x:hidden}
main{position:relative;z-index:2;max-width:640px;margin:0 auto;padding:28px 16px 190px;display:flex;flex-direction:column;align-items:center}
#theme{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:18px}
#env{margin-top:12vh;width:min(320px,86vw);aspect-ratio:3/2;border:0;cursor:pointer;position:relative;background:var(--soft);border-radius:10px;box-shadow:0 14px 34px var(--shadow);color:var(--accent);font:700 26px var(--hand);transition:transform .25s}
#env:hover,#env:focus-visible{transform:rotate(-2deg) scale(1.03);outline:3px solid var(--accent);outline-offset:4px}
#env::before{content:"";position:absolute;inset:0;border-radius:10px;background:linear-gradient(to bottom right,transparent 49.5%,var(--line) 50%) 0 0/50% 100% no-repeat,linear-gradient(to bottom left,transparent 49.5%,var(--line) 50%) 100% 0/50% 100% no-repeat;opacity:.7}
#env span{position:relative;display:block;padding-top:34%}
#env i{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:44px;font-style:normal}
#letter{display:none;width:100%;background:var(--paper);border-radius:14px;padding:26px 22px 22px;box-shadow:0 18px 44px var(--shadow);border:1px solid var(--line);background-image:repeating-linear-gradient(transparent 0 35px,var(--line) 35px 36px);background-position:0 70px}
#letter.on{display:block;animation:rise .7s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.94)}to{opacity:1;transform:none}}
.to{font:700 34px/1.1 var(--hand);color:var(--accent);margin:0 0 14px}
#msg{font:500 30px/36px var(--hand);min-height:216px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
#msg.swap{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.from{font:700 28px var(--hand);text-align:right;margin:10px 0 0;color:var(--accent)}
.count{font-size:14px;text-align:center;margin:14px 0 10px;opacity:.75}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
button.b{font:600 15px var(--serif);padding:10px 14px;border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
button.b:hover{background:var(--soft)}
button.b.main{background:var(--accent);color:var(--paper)}
button.b:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#edit{display:none;margin-top:12px;padding:14px;border-radius:12px;background:var(--soft)}
#edit.on{display:block}
#edit label{display:block;font-size:13px;margin:8px 0 3px}
#edit input,#edit textarea{width:100%;font:500 22px var(--hand);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px}
#edit textarea{min-height:130px;resize:vertical}
#garden{position:fixed;left:0;right:0;bottom:0;height:150px;z-index:1;pointer-events:none}
.fl{position:absolute;bottom:-6px;transform-origin:50% 100%;animation:grow 1.1s cubic-bezier(.2,1.4,.4,1) both,sway 4s ease-in-out infinite alternate}
.fl svg{width:100%;height:auto;display:block}
@keyframes grow{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes sway{from{rotate:-3deg}to{rotate:3deg}}
.petal{position:fixed;top:-40px;z-index:4;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(480deg);opacity:.85}}
@media (prefers-reduced-motion:reduce){.fl,#letter.on,#msg.swap{animation:none}.petal{display:none}}
</style>
</head>
<body>
<button id="theme" aria-label="Cambiar entre modo claro y oscuro">🌙</button>
<main>
  <button id="env" aria-label="Abrir la carta"><i>💌</i><span>Toca para abrir</span></button>
  <section id="letter" aria-live="polite">
    <p class="to">Para <span id="to"></span>:</p>
    <p id="msg"></p>
    <p class="from" id="from"></p>
    <p class="count" id="count"></p>
    <div class="row">
      <button class="b" id="prev">Anterior</button>
      <button class="b main" id="next">Siguiente mensaje</button>
      <button class="b" id="rand">Sorpresa</button>
    </div>
    <div class="row">
      <button class="b" id="bloom">Plantar flor</button>
      <button class="b" id="rain">Lluvia de pétalos</button>
      <button class="b" id="edt">Editar</button>
      <button class="b" id="add">Nuevo mensaje</button>
      <button class="b" id="del">Borrar</button>
    </div>
    <div id="edit">
      <label for="eTo">Para quién es la carta</label><input id="eTo" maxlength="40">
      <label for="eMsg">Este mensaje</label><textarea id="eMsg"></textarea>
      <label for="eFrom">Firma</label><input id="eFrom" maxlength="50">
      <div class="row"><button class="b main" id="done">Listo</button></div>
    </div>
  </section>
</main>
<div id="garden" aria-hidden="true"></div>
<script>
const KEY="carta-amor-v1";
const DEF={to:"Kim",from:"Con todo mi cariño",i:0,msgs:[
"Kim, eres la mejor parte de todos mis días.",
"Contigo hasta el lunes se siente como domingo.",
"Si me dieran a elegir mil veces, mil veces te elegiría a ti.",
"Tu sonrisa es mi lugar favorito en el mundo.",
"Gracias por hacer que lo simple se vuelva especial.",
"Me encanta cómo te ríes de tus propios chistes.",
"Contigo aprendí que la casa no es un lugar, es una persona.",
"Eres mi pensamiento favorito antes de dormir.",
"No necesito un mundo perfecto, solo uno donde estés tú.",
"Cada vez que te veo, me enamoro otra vez.",
"Tu abrazo arregla todo lo que está roto.",
"Prometo cuidarte, escucharte y hacerte reír, siempre.",
"Si el amor fuera una flor, el mío se llamaría Kim.",
"Eres la razón por la que creo en las casualidades bonitas.",
"Quiero todas mis aventuras contigo, las grandes y las pequeñas.",
"Gracias por quedarte incluso en mis días difíciles.",
"Contigo el tiempo vuela, pero me gustaría que se quedara.",
"Hoy y mañana, tú y yo, juntos.",
"Eres mi calma, mi risa y mi hogar.",
"Te quiero más de lo que cabe en esta carta, Kim."]};
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||null}catch(e){S=null}
if(!S||!Array.isArray(S.msgs)||!S.msgs.length)S=JSON.parse(JSON.stringify(DEF));
let i=Math.min(S.i||0,S.msgs.length-1),editing=false;
const $=id=>document.getElementById(id);
function save(){S.i=i;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function render(anim){
  $("to").textContent=S.to;$("from").textContent=S.from;
  const m=$("msg");m.textContent=S.msgs[i];
  if(anim){m.classList.remove("swap");void m.offsetWidth;m.classList.add("swap")}
  $("count").textContent="Mensaje "+(i+1)+" de "+S.msgs.length;
  save();
}
const COLS=["#ff5c8a","#ff9ebd","#ffb703","#c77dff","#ff6b6b","#ffffff","#8ecae6","#f72585"];
function flower(){
  const c=COLS[Math.floor(Math.random()*COLS.length)],n=5+Math.floor(Math.random()*4);let p="";
  for(let k=0;k<n;k++)p+='<ellipse cx="30" cy="16" rx="7" ry="12" fill="'+c+'" stroke="rgba(0,0,0,.12)" transform="rotate('+(k*360/n)+' 30 30)"/>';
  return '<svg viewBox="0 0 60 110"><path d="M30 30C28 60 32 80 30 110" stroke="#43a047" stroke-width="3" fill="none"/><ellipse cx="21" cy="76" rx="9" ry="4" fill="#66bb6a" transform="rotate(-30 21 76)"/><ellipse cx="39" cy="62" rx="9" ry="4" fill="#66bb6a" transform="rotate(30 39 62)"/>'+p+'<circle cx="30" cy="30" r="6" fill="#ffd166"/></svg>';
}
function plant(){
  const g=$("garden"),d=document.createElement("div");
  d.className="fl";d.style.left=(Math.random()*92)+"%";
  d.style.width=(44+Math.random()*34)+"px";
  d.style.animationDelay="0s,"+(-Math.random()*4)+"s";
  d.innerHTML=flower();g.appendChild(d);
  while(g.children.length>22)g.removeChild(g.firstChild);
}
function rain(){
  const E=["🌸","🌷","💗","🌹","✿"];
  for(let k=0;k<28;k++){
    const s=document.createElement("span");s.className="petal";
    s.textContent=E[k%E.length];s.style.left=(Math.random()*100)+"vw";
    s.style.fontSize=(16+Math.random()*18)+"px";
    s.style.animationDuration=(3+Math.random()*3)+"s";
    s.style.animationDelay=(Math.random()*1.5)+"s";
    document.body.appendChild(s);setTimeout(()=>s.remove(),7500);
  }
}
function go(n,anim=true){i=(n+S.msgs.length)%S.msgs.length;render(anim)}
function setEdit(on){
  editing=on;$("edit").classList.toggle("on",on);
  if(on){$("eTo").value=S.to;$("eFrom").value=S.from;$("eMsg").value=S.msgs[i];$("eMsg").focus()}
  $("edt").textContent=on?"Cerrar edición":"Editar";
}
$("env").onclick=()=>{$("env").style.display="none";$("letter").classList.add("on");rain();render(false)};
$("next").onclick=()=>{go(i+1);if(Math.random()<.6)plant()};
$("prev").onclick=()=>go(i-1);
$("rand").onclick=()=>{let n;do{n=Math.floor(Math.random()*S.msgs.length)}while(n===i&&S.msgs.length>1);go(n);plant()};
$("bloom").onclick=plant;
$("rain").onclick=rain;
$("edt").onclick=()=>setEdit(!editing);
$("done").onclick=()=>setEdit(false);
$("add").onclick=()=>{S.msgs.splice(i+1,0,"Escribe aquí tu nuevo mensaje");go(i+1);setEdit(true);$("eMsg").select()};
$("del").onclick=()=>{
  if(S.msgs.length>1){S.msgs.splice(i,1);go(Math.min(i,S.msgs.length-1))}
  else{S.msgs[0]="Escribe aquí tu mensaje";render(true)}
  if(editing)$("eMsg").value=S.msgs[i];
};
$("eMsg").oninput=e=>{S.msgs[i]=e.target.value;render(false)};
$("eTo").oninput=e=>{S.to=e.target.value;render(false)};
$("eFrom").oninput=e=>{S.from=e.target.value;render(false)};
document.addEventListener("keydown",e=>{
  if(editing||!$("letter").classList.contains("on"))return;
  if(e.key==="ArrowRight")go(i+1);if(e.key==="ArrowLeft")go(i-1);
});
$("theme").onclick=()=>{
  const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";$("theme").textContent=dark?"🌙":"☀️";
};
for(let k=0;k<7;k++)plant();
</script>
</body>
</html>
